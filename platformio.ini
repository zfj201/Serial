; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; 默认环境：上电串口菜单选模块（5 秒内发 1 或 2）
[env:esp32-c3-devkitm-1]
extends = env

; 跳过菜单，直接烧录指定模块（PlatformIO 底部环境切换后 Upload）
[env:serial_command]
extends = env
build_flags =
    ${env.build_flags}
    -DACTIVE_MODULE=1
    -DMODULE_PICK_TIMEOUT_MS=0

[env:reaction_speed]
extends = env
build_flags =
    ${env.build_flags}
    -DACTIVE_MODULE=2
    -DMODULE_PICK_TIMEOUT_MS=0

[env:breathe_led]
extends = env
build_flags =
    ${env.build_flags}
    -DACTIVE_MODULE=3
    -DMODULE_PICK_TIMEOUT_MS=0

[env:switch_led_mode]
extends = env
build_flags =
    ${env.build_flags}
    -DACTIVE_MODULE=4
    -DMODULE_PICK_TIMEOUT_MS=0

[env:wifi]
extends = env
build_flags =
    ${env.build_flags}
    -DACTIVE_MODULE=5
    -DMODULE_PICK_TIMEOUT_MS=0

[env:esp_hot_spot]
extends = env
build_flags =
    ${env.build_flags}
    -DACTIVE_MODULE=6
    -DMODULE_PICK_TIMEOUT_MS=0

[env:webserver]
extends = env
build_flags =
    ${env.build_flags}
    -DACTIVE_MODULE=7
    -DMODULE_PICK_TIMEOUT_MS=0

[env:web_button]
extends = env
build_flags =
    ${env.build_flags}
    -DACTIVE_MODULE=8
    -DMODULE_PICK_TIMEOUT_MS=0

[env:ble]
extends = env
board_build.partitions = huge_app.csv
build_flags =
    ${env.build_flags}
    -DACTIVE_MODULE=9
    -DMODULE_PICK_TIMEOUT_MS=0